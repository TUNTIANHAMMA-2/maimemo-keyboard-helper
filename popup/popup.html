<!doctype html>
<html lang="zh-CN" data-mm-ui="popup">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>墨墨学习助手</title>
  <link rel="stylesheet" href="../core/ui.css">
  <link rel="stylesheet" href="../core/liquid-glass.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header><div class="brand"><img class="brand-mark" src="../assets/maimemo-logo.png" width="36" height="36" alt="" aria-hidden="true"><div><p class="eyebrow">MAIMEMO HELPER</p><h1>墨墨学习助手</h1></div></div><button id="open-options" type="button">完整设置 ↗</button></header>
    <p class="caption">常用开关即时生效，快捷键编辑后保存。</p>
    <div class="panel-scroll">
    <section aria-label="显示外观">
      <div class="theme-picker" role="group" aria-label="显示主题"><button data-theme-value="system" data-setting-control type="button" aria-pressed="false" disabled>◐ 跟随系统</button><button data-theme-value="light" data-setting-control type="button" aria-pressed="false" disabled>☀ 浅色</button><button data-theme-value="dark" data-setting-control type="button" aria-pressed="false" disabled>☾ 深色</button></div>
      <label class="compact-row" for="glass"><span>玻璃效果</span><select id="glass" data-setting-control disabled><option value="full">完整 Liquid Glass</option><option value="system">跟随系统</option><option value="solid">纯色背景</option></select></label>
      <label class="switch-row"><span><strong>三色操作按钮</strong><small>常驻顶部，显示答案后可用</small></span><input id="trafficLights" data-setting-control type="checkbox" disabled></label>
      <label class="switch-row"><span><strong>阅读卡片</strong></span><input id="redesign" data-setting-control type="checkbox" disabled></label>
    </section>
    <section aria-labelledby="keyboard-title">
      <label class="switch-row"><span><strong id="keyboard-title">键盘快捷键</strong></span><input id="enabled" data-setting-control type="checkbox" disabled></label>
      <p class="hint" id="record-hint">点击按键框，按下新快捷键。Delete 清空，Esc 撤销本项编辑。</p>
      <div id="shortcut-fields" aria-describedby="record-hint"></div>
      <div class="shortcut-actions"><button id="save-shortcuts" data-setting-control class="primary" type="button" disabled>保存快捷键</button><button id="reset-shortcuts" data-setting-control type="button" disabled>默认快捷键</button></div>
    </section>
    <section aria-label="专注学习">
      <label class="switch-row"><span><strong>自动进入学习</strong></span><input id="autoStart" data-setting-control type="checkbox" disabled></label>
      <label class="switch-row"><span><strong>学习区铺满窗口</strong></span><input id="cleanPage" data-setting-control type="checkbox" disabled></label>
      <label class="switch-row"><span><strong>隐藏浮动提示</strong></span><input id="hideToasts" data-setting-control type="checkbox" disabled></label>
    </section>
    </div>
    <footer><button id="reapply-page" type="button">重新应用页面</button><button id="reload-settings" type="button">重新读取设置</button></footer>
    <p id="status" class="status" role="status" aria-live="polite">正在读取设置…</p>
  </main>
  <script src="../core/shortcut-utils.js"></script>
  <script src="../core/settings.js"></script>
  <script src="popup.js"></script>
  <script src="../content/liquid-glass.js"></script>
</body>
</html>

<!doctype html>
<html lang="zh-CN" data-mm-ui="options">
<head>
  <meta charset="utf-8">
  <title>Liquid Glass optical regression fixture</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; }
    #stripes { position: fixed; inset: 0; z-index: 0; }
    #stripes i { position: absolute; inset-block: 0; left: calc(var(--i) * 32px); width: 32px; background: #263e78; }
    #stripes i:nth-child(even) { background: #c9ddff; }
    main { position: absolute; top: 100px; left: 160px; width: 700px; z-index: 1; }
    section { display: grid; place-content: center; width: 100%; height: 360px; border-radius: 52px; border: 1px solid #ffffff80; box-sizing: border-box; }
    #optics-label { margin: 0; padding: 14px 18px; background: #fff; color: #102a44; font: 28px Arial, "Microsoft YaHei", sans-serif; }
  </style>
</head>
<body>
  <div id="_r_0_" hidden>Simulated ID owned by the website's separate React copy.</div>
  <div id="stripes" aria-hidden="true"></div>
  <main><section id="glass-lens"><h1 id="optics-label">Glass · 正文保持清晰</h1></section></main>
  <script>
    for (let i = 0; i < 60; i++) {
      const stripe = document.createElement('i');
      stripe.style.setProperty('--i', i);
      document.querySelector('#stripes').append(stripe);
    }
  </script>
</body>
</html>
